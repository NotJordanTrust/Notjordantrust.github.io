<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Encryptor & Decryptor</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 500px;
      margin: 40px auto;
      padding: 20px;
      background-color: rgb(150, 150, 150);
    }
    textarea {
      width: 100%;
      height: 100px;
      padding: 10px;
      margin: 10px 0;
      box-sizing: border-box;
      font-size: 16px;
    }
    .buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    button {
      flex: 1;
      padding: 10px;
      font-size: 16px;
      cursor: pointer;
      background-color: rgb(0, 0, 255);
      color: white;
      border: none;
      border-radius: 5px;
    }
    button.secondary {
      background-color: rgb(0, 0, 0);
    }
    .output-box {
      background: lightgrey;
      padding: 15px;
      border: 1px solid black;
      border-radius: 5px;
      min-height: 40px;
      word-break: break-all;
      font-family: monospace;
      font-size: 16px;
    }
    .input-box {
      background: lightgrey;
      padding: 15px;
      border: 1px solid black;
      border-radius: 5px;
      min-height: 100px;
      word-break: break-all;
      font-family: monospace;
      font-size: 16px;
      
    }
  </style>
</head>
<body>

  <h2>Cool Encryptor & Decryptor</h2>
  
  <label for="inputText"><strong>Enter Text:</strong></label>
  <textarea id="inputText" placeholder="Type your message here..." class = "input-box"></textarea>

  <div class="buttons">
    <button onclick="handleEncrypt()">Encrypt</button>
    <button class="secondary" onclick="handleDecrypt()">Decrypt</button>
  </div>

  <label><strong>Output:</strong></label>
  <div id="outputText" class="output-box"></div>

  <script>
    // Character mapping dictionary (cleaner and faster than long if/else chains)
    const encryptMap = {
      "a": "01", "b": "02", "c": "03", "d": "04", "e": "05", "f": "06", "g": "07",
      "h": ".1", "i": ".2", "j": ".3", "k": ".4", "l": ".5", "m": ".6"
    };

    // Reverse the map automatically for decryption
    const decryptMap = Object.fromEntries(
      Object.entries(encryptMap).map(([key, value]) => [value, key])
    );

    function encrypt(text) {
      // Equivalent to Python's text[::-1]
      const reversedText = text.split("").reverse().join("");
      let result = "";

      for (const char of reversedText) {
        result += encryptMap[char] || char;
      }
      return result;
    }

    function decrypt(encryptedText) {
      let result = "";
      let i = 0;

      while (i < encryptedText.length) {
        // Equivalent to Python's encryptedtext[i:i+2]
        const pair = encryptedText.slice(i, i + 2);
        
        if (decryptMap[pair]) {
          result += decryptMap[pair];
          i += 2;
        } else {
          result += encryptedText[i];
          i += 1;
        }
      }

      // Equivalent to Python's result2[::-1]
      return result.split("").reverse().join("");
    }

    // Connect JavaScript functions to the HTML page
    function handleEncrypt() {
      const input = document.getElementById("inputText").value;
      document.getElementById("outputText").textContent = encrypt(input);
    }

    function handleDecrypt() {
      const input = document.getElementById("inputText").value;
      document.getElementById("outputText").textContent = decrypt(input);
    }
  </script>

</body>
</html>
